[package]
name = "zeroclaw-config-ui"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
toml = "0.8"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "s"

[workspace]
